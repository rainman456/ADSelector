apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "adselector.fullname" . }}
  labels:
    {{- include "adselector.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "adselector.selectorLabels" . | nindent 6 }}
