apiVersion: v1
kind: Pod
metadata:
  name: {{ include "adselector.fullname" . }}-test-connection
  labels:
    {{- include "adselector.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - wget
        - -qO-
        - http://{{ include "adselector.fullname" . }}:{{ .Values.service.port }}/healthz
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
