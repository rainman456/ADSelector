# NOTE: this compose file has not been run or tested as part of
# scaffolding this project (see the CRITICAL CONSTRAINTS in the repo
# README -- no build/run/test commands have been executed). Images,
# ports, and env vars below are believed correct but unverified.

services:
  adselector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "impression_served"
      # "memory" demos in-process CAS-loop correctness (single replica);
      # switch to "redis" to demo the distributed Lua-script path across
      # multiple adselector replicas sharing one Redis instance.
      BUDGET_BACKEND: "memory"
      FREQCAP_BACKEND: "redis"
    depends_on:
      - redis
      - kafka

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

  # Single-node Kafka in KRaft mode -- no separate Zookeeper service needed.
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
